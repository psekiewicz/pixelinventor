<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - PixelInventor</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,700;1,400&family=Jersey+10&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="room">

  <header class="site-header">
    <a href="/" class="brand">
      <span class="brand-name">PixelInventor</span>
      <span class="brand-tagline">Robię gry i inne rzeczy</span>
    </a>
    <nav class="shelf" aria-label="Menu">
      <a href="/" class="cart"><span>START</span></a>
      <a href="/stuff.html" class="cart"><span>RZECZY</span></a>
      <a href="/log.html" class="cart"><span>LOG</span></a>
      <a href="/about.html" class="cart"><span>O MNIE</span></a>
    </nav>
  </header>

  <div class="monitor">
    <img class="monitor-cat" src="/img/art/cat.svg" alt="" width="16" height="16">
    <main class="screen">
      <div class="game-over">
        <h1>GAME OVER</h1>
        <p class="lede">Błąd 404. Tej strony tu nie ma. Może jeszcze jej nie zrobiłem?</p>
        <p class="dim">Kontynuować?</p>
        <ul class="continue">
          <li><a href="/">TAK, wróć na start</a></li>
        </ul>
      </div>
    </main>
    <div class="bezel" aria-hidden="true">
      <span class="led"></span>
      <span>PIXELINVENTOR</span>
      <span class="model">PI-486 COLOR</span>
      <span class="knob"></span>
      <span class="knob"></span>
    </div>
  </div>
  <div class="stand" aria-hidden="true"></div>

  <div class="desk">
    <div class="desk-top" aria-hidden="true">
      <div class="desk-items">
        <img class="console" src="/img/art/console.svg" alt="" width="32" height="15" style="--w: 32">
        <img class="controller" src="/img/art/controller.svg" alt="" width="24" height="11" style="--w: 24">
        <img class="plant" src="/img/art/plant.svg" alt="" width="14" height="20" style="--w: 14">
      </div>
    </div>
    <footer class="desk-front site-footer">
      <span>&copy; 2025 PixelInventor</span>
      <a href="https://github.com/psekiewicz">GitHub</a>
    </footer>
  </div>
  <div class="floor"></div>

</div>
</body>
</html>
